<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PrepTrack — Indian Bank Exam Preparation Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Production-ready preparation tracker for Indian banking exams: IBPS PO, SBI PO, IBPS Clerk, and SBI Clerk.">
  <meta name="theme-color" content="#2563eb">
  
  <!-- Web App Capabilities & Mobile Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PrepTrack">
  <meta name="format-detection" content="telephone=no">

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">
  <app-root></app-root>
  <script>
    // Global PWA prompt handler & event forwarding
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });

    window.addEventListener('appinstalled', () => {
      window.deferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
      console.log('PrepTrack PWA installed successfully');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => {
            console.log('PrepTrack PWA Service Worker Registered', reg);
          })
          .catch((err) => {
            console.warn('Service Worker registration error:', err);
          });
      });
    }
  </script>
</body>
</html>
